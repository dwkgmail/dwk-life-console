spring:
  application:
    name: dwk-life-os
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dwk_life_os?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:dwk}
    password: ${DB_PASSWORD:dwk_change_me}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123456}
  token:
    secret: ${TOKEN_SECRET:dwk-life-os-local-development-secret-change-me}
    ttl-hours: ${TOKEN_TTL_HOURS:12}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
